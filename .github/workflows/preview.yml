name: Preview deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: mock-preview build
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build mock-preview frontend
        run: npm run build:frontend:mock-preview
      - name: Upload mock-preview dist
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: quorum-mock-preview-dist
          path: frontend/dist-preview/
          retention-days: 1

  deploy:
    name: mock-preview deploy
    needs: build
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      preview_url: ${{ steps.deploy.outputs.preview_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Download mock-preview dist
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: quorum-mock-preview-dist
          path: frontend/dist-preview
      - name: Upload preview version
        id: deploy
        env:
          QUORUM_CLOUDFLARE_API_TOKEN_PREVIEW: ${{ secrets.QUORUM_CLOUDFLARE_API_TOKEN_PREVIEW }}
          QUORUM_CLOUDFLARE_ACCOUNT_ID: ${{ vars.QUORUM_CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          url=$(node scripts/upload-preview-version.mjs)
          if [ -n "$url" ]; then
            echo "preview_url=$url" >> "$GITHUB_OUTPUT"
          fi

  screenshots:
    name: mock-preview screenshots
    needs: [build, deploy]
    if: >-
      always() &&
      needs.build.result == 'success' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      artifact_url: ${{ steps.upload-screenshots.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Download mock-preview dist
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: quorum-mock-preview-dist
          path: frontend/dist-preview
      - name: Capture UI screenshots
        env:
          PREVIEW_BASE_URL: ${{ needs.deploy.outputs.preview_url }}
          PREVIEW_SCREENSHOTS_DIR: preview-screenshots
        run: node scripts/capture-preview-screenshots.mjs
      - name: Upload UI screenshots
        id: upload-screenshots
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: quorum-mock-preview-screenshots
          path: preview-screenshots/
          retention-days: 7

  comment:
    name: mock-preview comment
    needs: [deploy, screenshots]
    if: >-
      always() &&
      !cancelled() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (needs.deploy.outputs.preview_url != '' || needs.screenshots.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Find preview comment
        id: find-comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: "<!-- quorum-mock-preview -->"
      - name: Compose preview comment
        id: compose
        env:
          PREVIEW_URL: ${{ needs.deploy.outputs.preview_url }}
          SCREENSHOT_ARTIFACT_URL: ${{ needs.screenshots.outputs.artifact_url }}
        run: |
          set -euo pipefail
          {
            echo '<!-- quorum-mock-preview -->'
            echo '## Mock preview deploy'
            echo ''
            if [ -n "$PREVIEW_URL" ]; then
              echo "**Preview URL:** $PREVIEW_URL"
              echo ''
              echo 'Opens the app at `/app/` (root redirects to `/app/` on the preview Worker). Built with `mock-preview` mode (no API, no auth). Re-push to refresh this deployment.'
              echo ''
            else
              echo '_Preview deploy was skipped (missing Cloudflare preview credentials or Worker bootstrap)._'
              echo ''
            fi
            echo '## UI screenshots'
            echo ''
            if [ -n "$SCREENSHOT_ARTIFACT_URL" ]; then
              echo "**Artifact:** Download \`quorum-mock-preview-screenshots\` from [$SCREENSHOT_ARTIFACT_URL]($SCREENSHOT_ARTIFACT_URL) (landing, sign-in, chat, connections at 390px and 1280px, light and dark)."
            else
              echo '_UI screenshots were not uploaded for this run._'
            fi
          } > preview-comment.md
      - name: Update preview comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body-file: preview-comment.md
