name: Preview deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GALLERY_PROBE_MARKER: quorum-gallery-bundle-probe

permissions: {}

jobs:
  build:
    name: mock-preview build
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build mock-preview frontend
        run: npm run build:frontend:mock-preview
      - name: Upload mock-preview dist
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: quorum-mock-preview-dist
          path: frontend/dist-preview/
          retention-days: 1

  deploy:
    name: mock-preview deploy
    needs: build
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      preview_url: ${{ steps.deploy.outputs.preview_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Download mock-preview dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: quorum-mock-preview-dist
          path: frontend/dist-preview
      - name: Upload preview version
        id: deploy
        env:
          QUORUM_CLOUDFLARE_API_TOKEN_PREVIEW: ${{ secrets.QUORUM_CLOUDFLARE_API_TOKEN_PREVIEW }}
          QUORUM_CLOUDFLARE_ACCOUNT_ID: ${{ vars.QUORUM_CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          url=$(node scripts/upload-preview-version.mjs)
          if [ -n "$url" ]; then
            echo "preview_url=$url" >> "$GITHUB_OUTPUT"
          fi

  gallery-probe:
    name: gallery preview probe
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.result == 'success' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    outputs:
      probe_outcome: ${{ steps.probe.outcome }}
      creds_ready: ${{ steps.creds.outputs.ready }}
    steps:
      - name: Detect preview credentials
        id: creds
        env:
          CF_TOKEN: ${{ secrets.QUORUM_CLOUDFLARE_API_TOKEN_PREVIEW }}
          CF_ACCOUNT: ${{ vars.QUORUM_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -n "${CF_TOKEN}" ] && [ -n "${CF_ACCOUNT}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Probe gallery route
        id: probe
        if: steps.creds.outputs.ready == 'true' && needs.deploy.outputs.preview_url != ''
        env:
          PREVIEW_URL: ${{ needs.deploy.outputs.preview_url }}
        run: |
          set -euo pipefail
          origin="${PREVIEW_URL%/app/}"
          origin="${origin%/app}"
          origin="${origin%/}"
          curl_common=(--fail --show-error --silent --location --retry 3 --retry-delay 5 --retry-all-errors)
          gallery_headers="$(curl "${curl_common[@]}" -sSI "${origin}/gallery/")"
          if ! grep -qi 'x-robots-tag:.*noindex' <<<"$gallery_headers"; then
            echo "Expected X-Robots-Tag with noindex on /gallery/."
            printf '%s\n' "$gallery_headers"
            exit 1
          fi
          gallery_html="$(curl "${curl_common[@]}" "${origin}/gallery/")"
          if ! grep -qiE 'name="robots"[^>]*content="[^"]*nofollow' <<<"$gallery_html"; then
            echo "Expected meta robots nofollow in /gallery/ HTML."
            exit 1
          fi
          if grep -q "${GALLERY_PROBE_MARKER}" <<<"$gallery_html"; then
            echo "Gallery probe marker must not appear in SPA HTML (only in built assets)."
            exit 1
          fi
          js_path="$(grep -oE -m1 '/gallery/assets/index-[^"]+\.js' <<<"$gallery_html")"
          if [ -z "$js_path" ]; then
            echo "Could not find gallery JS asset in /gallery/ HTML."
            exit 1
          fi
          js_body="$(curl "${curl_common[@]}" "${origin}${js_path}")"
          grep -q "${GALLERY_PROBE_MARKER}" <<<"$js_body"
      - name: Gallery preview check (deployed)
        if: ${{ !cancelled() && steps.creds.outputs.ready == 'true' && steps.probe.outcome == 'success' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const appUrl = process.env.PREVIEW_URL.replace(/\/$/, '');
            const origin = appUrl.replace(/\/app\/?$/, '');
            const galleryUrl = `${origin}/gallery`;
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'gallery-preview',
              head_sha: context.payload.pull_request.head.sha,
              status: 'completed',
              conclusion: 'success',
              output: {
                title: 'Gallery preview',
                summary: `[Open component gallery](${galleryUrl})`,
              },
            });
        env:
          PREVIEW_URL: ${{ needs.deploy.outputs.preview_url }}
      - name: Gallery preview check (unconfigured)
        if: ${{ !cancelled() && steps.creds.outputs.ready != 'true' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'gallery-preview',
              head_sha: context.payload.pull_request.head.sha,
              status: 'completed',
              conclusion: 'neutral',
              output: {
                title: 'Gallery preview not configured',
                summary:
                  'Set secret QUORUM_CLOUDFLARE_API_TOKEN_PREVIEW and variable QUORUM_CLOUDFLARE_ACCOUNT_ID to enable mock-preview and gallery on pull requests.',
              },
            });
      - name: Gallery preview check (failed)
        if: ${{ !cancelled() && steps.creds.outputs.ready == 'true' && steps.probe.outcome != 'success' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'gallery-preview',
              head_sha: context.payload.pull_request.head.sha,
              status: 'completed',
              conclusion: 'failure',
              output: {
                title: 'Gallery preview failed',
                summary:
                  'Deploy or the /gallery probe did not pass. See the Preview deploy workflow log for this pull request.',
              },
            });
      - name: Fail if gallery probe did not succeed with creds
        if: ${{ !cancelled() && steps.creds.outputs.ready == 'true' && steps.probe.outcome != 'success' }}
        run: exit 1

  screenshots:
    name: mock-preview screenshots
    needs: [build, deploy]
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      artifact_url: ${{ steps.upload-screenshots.outputs.artifact-url }}
      capture_source: ${{ steps.capture-meta.outputs.source }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Download mock-preview dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: quorum-mock-preview-dist
          path: frontend/dist-preview
      - name: Capture UI screenshots
        env:
          PREVIEW_BASE_URL: ${{ needs.deploy.outputs.preview_url }}
          PREVIEW_SCREENSHOTS_DIR: preview-screenshots
        run: node scripts/capture-preview-screenshots.mjs
      - name: Record capture metadata
        id: capture-meta
        run: |
          set -euo pipefail
          source_file="preview-screenshots/capture-source.txt"
          if [ ! -f "$source_file" ]; then
            echo "source=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "source=$(tr -d '\n' < "$source_file")" >> "$GITHUB_OUTPUT"
      - name: Verify screenshot count
        env:
          PREVIEW_SCREENSHOTS_DIR: preview-screenshots
        run: node scripts/verify-preview-screenshot-count.mjs
      - name: Upload UI screenshots
        id: upload-screenshots
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: quorum-mock-preview-screenshots
          path: preview-screenshots/
          retention-days: 7
          if-no-files-found: error

  comment:
    name: mock-preview comment
    needs: [deploy, screenshots, gallery-probe]
    if: ${{ !cancelled() && needs.deploy.result == 'success' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Find preview comment
        id: find-comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: "<!-- quorum-mock-preview -->"
      - name: Compose preview comment
        id: compose
        env:
          PREVIEW_URL: ${{ needs.deploy.outputs.preview_url }}
          SCREENSHOTS_RESULT: ${{ needs.screenshots.result }}
          SCREENSHOT_ARTIFACT_URL: ${{ needs.screenshots.outputs.artifact_url }}
          CAPTURE_SOURCE: ${{ needs.screenshots.outputs.capture_source }}
          CREDS_READY: ${{ needs.gallery-probe.outputs.creds_ready }}
          PROBE_OUTCOME: ${{ needs.gallery-probe.outputs.probe_outcome }}
          PREVIEW_OUTCOME: ${{ needs.deploy.result }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          preview_mode="$(CREDS_READY="$CREDS_READY" PREVIEW_OUTCOME="$PREVIEW_OUTCOME" PROBE_OUTCOME="$PROBE_OUTCOME" node scripts/gallery-preview-mode.mjs | sed 's/^mode=//')"
          gallery_body="$(PREVIEW_MODE="$preview_mode" PREVIEW_URL="$PREVIEW_URL" PR_HEAD_SHA="$PR_HEAD_SHA" OUTPUT_MODE=body node scripts/gallery-preview-summary.mjs)"
          {
            echo '<!-- quorum-mock-preview -->'
            echo '## Mock preview deploy'
            echo ''
            if [ -n "$PREVIEW_URL" ]; then
              echo "**Preview URL:** $PREVIEW_URL"
              echo ''
              echo 'Opens the app at `/app/` (`dist-preview` uses static `_redirects` from `/` to `/app/`). Built with `mock-preview` mode (no API, no auth). Re-push to refresh this deployment.'
              echo ''
            else
              echo '_Preview deploy was skipped (missing Cloudflare preview credentials or Worker bootstrap)._'
              echo ''
            fi
            echo "$gallery_body"
            echo ''
            echo '## UI screenshots'
            echo ''
            if [ "$SCREENSHOTS_RESULT" = "success" ]; then
              if [ -n "$SCREENSHOT_ARTIFACT_URL" ]; then
                echo "**Artifact:** Download \`quorum-mock-preview-screenshots\` from [$SCREENSHOT_ARTIFACT_URL]($SCREENSHOT_ARTIFACT_URL) (landing from repo \`landing/\`, sign-in, chat, connections at 390px and 1280px, light and dark)."
              fi
              if [ "$CAPTURE_SOURCE" = "local-static-server" ]; then
                echo ''
                echo '_App screenshots used the local mock-preview static server fallback (honours `_redirects` / `_headers`); landing PNGs always come from repo `landing/`._'
              fi
            else
              echo "_UI screenshots failed or were skipped for this run (job result: \`$SCREENSHOTS_RESULT\`)._"
            fi
          } > preview-comment.md
      - name: Update preview comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body-file: preview-comment.md
