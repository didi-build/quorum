schema_version: 1
d1_tables: {}
other_items:
  - id: d1.quorum_db
    binding: DB
    whose: operational
    data: Application relational data (users, sessions, sources, chunks, chat, proposals)
    purpose: persistence for Quorum API and indexing pipeline
    processors: [Cloudflare]
    retention: until deleted per account-deletion runbook
    verified: false
  - id: queue.indexing
    binding: INDEXING_QUEUE
    whose: operational
    data: Knowledge-source indexing job payloads (repo or team ids, connection refs)
    purpose: async indexing with retries
    processors: [Cloudflare]
    retention: until queue consumer deletes message
    verified: false
  - id: vectorize.embeddings
    binding: VECTORIZE
    whose: operational
    data: 1024-dimensional chunk embeddings and metadata (knowledge_source_id)
    purpose: hybrid retrieval vector leg (see stack ADR; not validated by nodrift Check 2)
    processors: [Cloudflare, Voyage AI]
    retention: until source or chunk is deleted
    verified: false
