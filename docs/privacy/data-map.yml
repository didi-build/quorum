schema_version: 1
d1_tables:
  users:
    defaults:
      storage: D1
      processors: [Cloudflare]
      who_can_see: operator
      source: migrations/0001_initial_schema.sql
      verified: false
    columns:
      id:
        whose: operational
        data: User UUID primary key
        purpose: identity and foreign keys
        retention: until account deletion runbook
      github_id:
        whose: user
        data: GitHub numeric user id
        purpose: sign-in identity and uniqueness
        retention: until account deletion runbook
      login:
        whose: user
        data: GitHub login handle
        purpose: display in app UI and audit
        retention: until account deletion runbook
      created_at:
        whose: operational
        data: Account creation timestamp (ISO 8601 UTC)
        purpose: audit and support
        retention: until account deletion runbook

  sessions:
    defaults:
      storage: D1
      processors: [Cloudflare]
      who_can_see: operator
      source: migrations/0001_initial_schema.sql
      verified: false
    columns:
      id:
        whose: operational
        data: Browser session UUID
        purpose: primary key
        retention: until 30 days after the earlier of expires_at or revoked_at, then purged by daily Worker cron (rows persist until that job runs; production cron not deployed yet; see docs/privacy/retention.md)
      user_id:
        whose: user
        data: Owning user UUID
        purpose: session ownership
        retention: until 30 days after the earlier of expires_at or revoked_at, then purged by daily Worker cron (rows persist until that job runs; production cron not deployed yet; see docs/privacy/retention.md)
      token_hash:
        whose: operational
        data: SHA-256 hash of session cookie token
        purpose: authenticate browser sessions without storing raw token
        retention: until 30 days after the earlier of expires_at or revoked_at, then purged by daily Worker cron (rows persist until that job runs; production cron not deployed yet; see docs/privacy/retention.md)
        notes: secret
      created_at:
        whose: operational
        data: Session creation timestamp (ISO 8601 UTC)
        purpose: audit
        retention: until 30 days after the earlier of expires_at or revoked_at, then purged by daily Worker cron (rows persist until that job runs; production cron not deployed yet; see docs/privacy/retention.md)
      expires_at:
        whose: operational
        data: Session expiry timestamp (ISO 8601 UTC)
        purpose: enforce session lifetime
        retention: until 30 days after the earlier of expires_at or revoked_at, then purged by daily Worker cron (rows persist until that job runs; production cron not deployed yet; see docs/privacy/retention.md)
      revoked_at:
        whose: operational
        data: Session revocation timestamp (ISO 8601 UTC) when set
        purpose: sign-out and security
        retention: until 30 days after the earlier of expires_at or revoked_at, then purged by daily Worker cron (rows persist until that job runs; production cron not deployed yet; see docs/privacy/retention.md)

  api_keys:
    defaults:
      storage: D1
      processors: [Cloudflare]
      who_can_see: operator
      source: migrations/0001_initial_schema.sql
      verified: false
    columns:
      id:
        whose: operational
        data: API key UUID
        purpose: primary key
        retention: until manual bootstrap rotation (delete D1 row per docs/privacy/retention.md) or account deletion runbook
      key_hash:
        whose: operational
        data: SHA-256 hash of API key material
        purpose: authenticate API clients without storing raw key
        retention: until manual bootstrap rotation (delete D1 row per docs/privacy/retention.md) or account deletion runbook
        notes: secret
      user_id:
        whose: user
        data: Optional scoped user UUID
        purpose: attribute API usage to an allowlisted user
        retention: until manual bootstrap rotation (delete D1 row per docs/privacy/retention.md) or account deletion runbook
      project_id:
        whose: operational
        data: Optional project UUID scope
        purpose: future multi-project isolation
        retention: until manual bootstrap rotation (delete D1 row per docs/privacy/retention.md) or account deletion runbook
      created_at:
        whose: operational
        data: API key creation timestamp (ISO 8601 UTC)
        purpose: audit
        retention: until manual bootstrap rotation (delete D1 row per docs/privacy/retention.md) or account deletion runbook

  connections:
    defaults:
      storage: D1
      processors: [Cloudflare]
      who_can_see: operator
      source: migrations/0001_initial_schema.sql
      verified: false
    columns:
      id:
        whose: operational
        data: Connection UUID
        purpose: primary key
        retention: until connection deleted or account deletion runbook
      user_id:
        whose: user
        data: Owning user UUID
        purpose: tie OAuth and GitHub App connections to an allowlisted user
        retention: until connection deleted or account deletion runbook
      provider:
        whose: operational
        data: Provider name (github or linear)
        purpose: route API calls to the correct integration
        retention: until connection deleted
      access_token_ciphertext:
        whose: user
        data: AES-GCM ciphertext of OAuth access token for Linear (nullable for GitHub App); encryption implemented in DIDI-773 using Wrangler secret TOKEN_ENCRYPTION_KEY; no writer exists yet and plaintext must never be stored
        purpose: call Linear API on behalf of the user after DIDI-773 lands
        processors: [Cloudflare]
        retention: until connection deleted or token rotated
        notes: secret
      refresh_token_ciphertext:
        whose: user
        data: AES-GCM ciphertext of OAuth refresh token when issued; encryption implemented in DIDI-773 using Wrangler secret TOKEN_ENCRYPTION_KEY; no writer exists yet and plaintext must never be stored
        purpose: refresh Linear OAuth access after DIDI-773 lands
        processors: [Cloudflare]
        retention: until connection deleted or token rotated
        notes: secret
      token_expires_at:
        whose: operational
        data: OAuth access token expiry timestamp (ISO 8601 UTC)
        purpose: proactive token refresh
        retention: until connection deleted
      installation_id:
        whose: operational
        data: GitHub App installation id string when connected via App
        purpose: fetch installation tokens for repo indexing and write-back
        retention: until connection deleted
      external_account_id:
        whose: user
        data: Provider account id (GitHub user or org id, Linear workspace id)
        purpose: identify connected account in provider APIs
        retention: until connection deleted
      external_account_name:
        whose: user
        data: Provider account display name or login
        purpose: show connected account in UI
        retention: until connection deleted
      created_at:
        whose: operational
        data: Connection creation timestamp (ISO 8601 UTC)
        purpose: audit
        retention: until connection deleted
      updated_at:
        whose: operational
        data: Connection last update timestamp (ISO 8601 UTC)
        purpose: audit
        retention: until connection deleted

  knowledge_sources:
    defaults:
      storage: D1
      processors: [Cloudflare]
      who_can_see: operator
      source: migrations/0001_initial_schema.sql
      verified: false
    columns:
      id:
        whose: operational
        data: Knowledge source UUID
        purpose: primary key and Vectorize metadata
        retention: until source deleted
      user_id:
        whose: user
        data: Optional owning user UUID
        purpose: access control via can_access()
        retention: until source deleted
      project_id:
        whose: operational
        data: Optional project UUID scope
        purpose: access control via can_access()
        retention: until source deleted
      source_type:
        whose: operational
        data: Source kind (github_repo or linear)
        purpose: choose indexing adapter
        retention: until source deleted
      external_ref:
        whose: operational
        data: Repo slug or Linear team id reference string
        purpose: locate content in provider APIs
        retention: until source deleted
      connection_id:
        whose: operational
        data: Parent connection UUID
        purpose: resolve credentials for indexing
        retention: until source deleted
      name:
        whose: user
        data: Human-readable source label shown in UI
        purpose: source list and chat context
        retention: until source deleted
      status:
        whose: operational
        data: Indexing lifecycle status (pending, indexing, ready, error)
        purpose: UI and queue orchestration
        retention: until source deleted
      status_message:
        whose: operational
        data: Optional error or progress detail string
        purpose: surface indexing failures to the user
        retention: until source deleted
      last_indexed_at:
        whose: operational
        data: Last successful index completion timestamp (ISO 8601 UTC)
        purpose: UI freshness and support
        retention: until source deleted
      indexing_run_id:
        whose: operational
        data: UUID identifying the active indexing queue run for this source
        purpose: ignore stale queue redeliveries (DIDI-933)
        retention: until source deleted
      created_at:
        whose: operational
        data: Source creation timestamp (ISO 8601 UTC)
        purpose: audit
        retention: until source deleted
      updated_at:
        whose: operational
        data: Source last update timestamp (ISO 8601 UTC)
        purpose: audit
        retention: until source deleted

  chunks:
    defaults:
      storage: D1
      processors: [Cloudflare]
      who_can_see: operator
      source: migrations/0001_initial_schema.sql
      verified: false
    columns:
      id:
        whose: operational
        data: Chunk integer primary key (stored in Vectorize metadata as chunk_rowid, not as the vector id)
        purpose: D1 row identity and FTS5 rowid; Vectorize uses a separate 64-char SHA-256 hex id derived from knowledge_source_id, document_id, and chunk_index
        retention: until parent knowledge source deleted
      knowledge_source_id:
        whose: operational
        data: Parent knowledge source UUID
        purpose: cascade delete and retrieval filters
        retention: until parent knowledge source deleted
      document_id:
        whose: operational
        data: Provider document path or issue id string
        purpose: citations and deduplication
        retention: until parent knowledge source deleted
      chunk_index:
        whose: operational
        data: Zero-based chunk order within document
        purpose: stable chunk identity
        retention: until parent knowledge source deleted
      content:
        whose: user
        data: Indexed text from connected GitHub or Linear content (may include names and issue text)
        purpose: hybrid retrieval keyword leg, Voyage embeddings, and council context
        processors: [Cloudflare, Voyage AI, Anthropic]
        retention: until parent knowledge source deleted
      heading_hierarchy:
        whose: operational
        data: JSON array of heading strings for the chunk
        purpose: citation display in chat and council prompts
        processors: [Cloudflare, Anthropic]
        retention: until parent knowledge source deleted
      created_at:
        whose: operational
        data: Chunk creation timestamp (ISO 8601 UTC)
        purpose: audit
        retention: until parent knowledge source deleted

  chunks_fts:
    defaults:
      storage: D1
      processors: [Cloudflare]
      who_can_see: operator
      source: migrations/0001_initial_schema.sql
      verified: false
    columns:
      content:
        whose: user
        data: External-content FTS5 index over chunks.content for bm25 search
        purpose: keyword retrieval leg; matched excerpts may be sent to Anthropic in chat and council
        processors: [Cloudflare, Anthropic]
        retention: until parent chunk deleted

  chat_messages:
    defaults:
      storage: D1
      processors: [Cloudflare]
      who_can_see: operator
      source: migrations/0001_initial_schema.sql
      verified: false
    columns:
      id:
        whose: operational
        data: Chat message UUID
        purpose: primary key
        retention: until account deletion runbook
      session_id:
        whose: operational
        data: Chat conversation UUID (v1 GET /sessions/{session_id}/messages), not the browser auth session row
        purpose: group messages in one chat thread
        retention: until account deletion runbook
      user_id:
        whose: user
        data: Owning user UUID
        purpose: access control via can_access()
        retention: until account deletion runbook
      project_id:
        whose: operational
        data: Optional project UUID scope
        purpose: access control via can_access()
        retention: until account deletion runbook
      role:
        whose: operational
        data: Message role (user, assistant, system)
        purpose: render chat transcript
        retention: until account deletion runbook
      content:
        whose: user
        data: Message body text
        purpose: unified chat and council transcript sent to Anthropic
        processors: [Cloudflare, Anthropic]
        retention: until account deletion runbook
      classified_intent:
        whose: operational
        data: Supervisor intent label when set
        purpose: analytics and debugging
        retention: until account deletion runbook
      response_kind:
        whose: operational
        data: Response shape label (direct answer, council, and similar)
        purpose: UI routing
        retention: until account deletion runbook
      citations:
        whose: user
        data: JSON array of citation objects from retrieval
        purpose: show sources in chat UI and council prompts
        processors: [Cloudflare, Anthropic]
        retention: until account deletion runbook
      council_decision:
        whose: user
        data: JSON council verdict payload when present
        purpose: show seat opinions and chair synthesis
        processors: [Cloudflare, Anthropic]
        retention: until account deletion runbook
      created_at:
        whose: operational
        data: Message creation timestamp (ISO 8601 UTC)
        purpose: order transcript
        retention: until account deletion runbook

  write_back_proposals:
    defaults:
      storage: D1
      processors: [Cloudflare]
      who_can_see: operator
      source: migrations/0001_initial_schema.sql
      verified: false
    columns:
      id:
        whose: operational
        data: Write-back proposal UUID
        purpose: primary key
        retention: until account deletion runbook
      chat_message_id:
        whose: operational
        data: Originating chat message UUID
        purpose: one proposal per council message
        retention: until account deletion runbook
      user_id:
        whose: user
        data: Owning user UUID
        purpose: access control via can_access()
        retention: until account deletion runbook
      project_id:
        whose: operational
        data: Optional project UUID scope
        purpose: access control via can_access()
        retention: until account deletion runbook
      plan:
        whose: user
        data: JSON write-back plan (GitHub PR and Linear issue actions)
        purpose: user review and Anthropic write-back planning
        processors: [Cloudflare, Anthropic]
        retention: until account deletion runbook
      feedback_history:
        whose: user
        data: JSON array of user feedback on the plan
        purpose: refine write-back proposals via Anthropic
        processors: [Cloudflare, Anthropic]
        retention: until account deletion runbook
      status:
        whose: operational
        data: Proposal status (proposed, confirmed, executed)
        purpose: write-back workflow state machine
        retention: until account deletion runbook
      execution_results:
        whose: user
        data: JSON array of per-action execution outcomes
        purpose: show PR links and errors after execution
        processors: [Cloudflare]
        retention: until account deletion runbook
      created_at:
        whose: operational
        data: Proposal creation timestamp (ISO 8601 UTC)
        purpose: audit
        retention: until account deletion runbook
      updated_at:
        whose: operational
        data: Proposal last update timestamp (ISO 8601 UTC)
        purpose: audit
        retention: until account deletion runbook
      executed_at:
        whose: operational
        data: Execution completion timestamp (ISO 8601 UTC) when set
        purpose: audit
        retention: until account deletion runbook

other_items:
  - id: d1.quorum_db
    binding: DB
    whose: user
    data: Account and session records, OAuth connection metadata, indexed source and chunk text, chat messages, and write-back proposals for allowlisted users
    purpose: persistence for Quorum API, auth, indexing, chat, and write-back state
    processors: [Cloudflare]
    retention: until deleted per account-deletion runbook
    verified: false
  - id: queue.indexing
    binding: INDEXING_QUEUE
    whose: operational
    data: Knowledge-source indexing job payloads (source id, indexing run id, GitHub continuation cursor)
    purpose: async indexing with retries
    processors: [Cloudflare]
    retention: until queue consumer deletes message
    verified: false
  - id: vectorize.embeddings
    binding: VECTORIZE
    whose: user
    data: 1024-dimensional embeddings and chunk metadata derived from connected GitHub and Linear content (may include author names, handles, and issue text)
    purpose: hybrid retrieval vector leg (see stack ADR; not validated by nodrift Check 2)
    processors: [Cloudflare, Voyage AI]
    retention: until source or chunk is deleted
    verified: false
